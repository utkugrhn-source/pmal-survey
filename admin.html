// ── CLIENT ERROR LOGGING (admin) ──
(function () {
  let sent = 0;
  const seen = new Set();
  window._pmalLogError = function (kind, message, extra) {
    try {
      if (sent >= 10) return;
      const key = kind + "|" + String(message).slice(0, 120);
      if (seen.has(key)) return;
      seen.add(key);
      sent++;
      fetch(`${SB_URL}/rest/v1/client_errors`, {
        method: "POST",
        headers: { ...sbHeaders, "Prefer": "return=minimal" },
        body: JSON.stringify({
          app: "admin",
          kind: kind,
          message: String(message).slice(0, 1000),
          extra: extra ? String(extra).slice(0, 1000) : null,
          url: location.href.slice(0, 300),
          user_agent: navigator.userAgent
        })
      }).catch(function () {});
    } catch (e) {}
  };
  window.addEventListener("error", function (ev) {
    window._pmalLogError("uncaught_error", ev.message || "unknown", (ev.filename || "") + ":" + (ev.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    window._pmalLogError("unhandled_rejection", (r && (r.message || r.toString())) || "unknown", null);
  });
})();

ed with the same plan as in a healthy patient":"Hayır — sağlıklı hastadakiyle aynı planı uygularım","Nein — ich würde wie bei einem gesunden Patienten vorgehen":"Hayır — sağlıklı hastadakiyle aynı planı uygularım","No — seguiría el mismo plan que en un paciente sano":"Hayır — sağlıklı hastadakiyle aynı planı uygularım"},"*_fix":{"Yes":"Evet","Ja":"Evet","Sí":"Evet","No":"Hayır","Nein":"Hayır"}};
function pmalCanonValue(key, v) {
  if (v == null) return v;
  let m = PMAL_LABELMAP[key];
  if (!m) {
    const g = /^g\d_case\d_(.+)$/.exec(key);
    if (g) m = PMAL_LABELMAP["*_" + g[1]];
  }
  if (!m) return v;
  if (Array.isArray(v)) return v.map(x => typeof x === "string" && m[x] ? m[x] : x);
  return typeof v === "string" && m[v] ? m[v] : v;
}

// Returns a canonicalised COPY of a response row (data + classic case columns).
function pmalCanonRow(r) {
  if (!r || typeof r !== "object") return r;
  const out = {
    ...r
  };
  if (r.data && typeof r.data === "object") {
    const d = {};
    for (const k in r.data) d[k] = pmalCanonValue(k, r.data[k]);
    out.data = d;
  }
  for (const k in r) {
    if (/^g\d_case\d_/.test(k)) out[k] = pmalCanonValue(k, r[k]);
  }
  return out;
}
const pmalCanonRows = rows => Array.isArray(rows) ? rows.map(pmalCanonRow) : rows;

// ── Shared store ──
const PmalStore = {
  rows: null,
  loading: null,
  subs: new Set(),
  load(force) {
    if (this.loading && !force) return this.loading;
    if (this.rows && !force) return Promise.resolve(this.rows);
    this.loading = wkGet("responses", "select=*&completed=eq.true&order=created_at.asc").then(d => {
      this.rows = Array.isArray(d) ? pmalCanonRows(d) : [];
      this.loading = null;
      this.subs.forEach(fn => fn(this.rows));
      return this.rows;
    }).catch(e => {
      this.loading = null;
      console.error("PmalStore load error:", e);
      throw e;
    });
    return this.loading;
  },
  subscribe(fn) {
    this.subs.add(fn);
    return () => this.subs.delete(fn);
  }
};
function usePmalRows() {
  const [rows, setRows] = React.useState(PmalStore.rows);
  const [err, setErr] = React.useState(null);
  React.useEffect(() => {
    const un = PmalStore.subscribe(setRows);
    PmalStore.load().then(setRows).catch(e => setErr(String(e && e.message || e)));
    return un;
  }, []);
  return {
    rows,
    err
  };
}

const pmalQuantile = (sorted, q) => {
  if (!sorted.length) return null;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos),
    hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
};
const pmalMin = s => s == null ? "—" : (s / 60).toFixed(1).replace(".", ",") + " dk";
const pmalDay = iso => (iso || "").slice(0, 10);
const pmalFmtDate = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString((window.PMAL_LOCALE||"tr-TR"), {
    day: "2-digit",
    month: "short"
  }) + " " + d.toLocaleTimeString((window.PMAL_LOCALE||"tr-TR"), {
    hour: "2-digit",
    minute: "2-digit"
  });
};

// ── Sound: synthesised applause (no asset needed) ──
const PmalSound = {
  ctx: null,
  muted: (() => {
    try {
      return localStorage.getItem("pmal_fx_muted") === "1";
    } catch (e) {
      return false;
    }
  })(),
  setMuted(m) {
    this.muted = m;
    try {
      localStorage.setItem("pmal_fx_muted", m ? "1" : "0");
    } catch (e) {}
  },
  applause(seconds = 2.6) {
    if (this.muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = this.ctx || new AC();
      const ctx = this.ctx;
      if (ctx.state === "suspended") ctx.resume();
      const sr = ctx.sampleRate;
      const len = Math.floor(sr * seconds);
      const buf = ctx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        // Hundreds of short, randomly timed "claps" → crowd applause texture
        const claps = Math.floor(seconds * 140);
        for (let c = 0; c < claps; c++) {
          const t0 = Math.floor(Math.random() * (len - sr * 0.03));
          const clapLen = Math.floor(sr * (0.008 + Math.random() * 0.018));
          const amp = 0.25 + Math.random() * 0.5;
          for (let i = 0; i < clapLen; i++) {
            data[t0 + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / (clapLen / 4));
          }
        }
        // Swell in, fade out
        for (let i = 0; i < len; i++) {
          const x = i / len;
          const env = Math.min(1, x / 0.12) * Math.pow(1 - x, 1.4);
          data[i] *= env * 0.5;
        }
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1800;
      bp.Q.value = 0.6;
      const gain = ctx.createGain();
      gain.gain.value = 0.55;
      src.connect(bp).connect(gain).connect(ctx.destination);
      src.start();
    } catch (e) {/* sound is decoration only */}
  }
};

// ── Watcher: new responses → event + tab title ──
const PMAL_BASE_TITLE = document.title;
function usePmalWatcher(enabled) {
  React.useEffect(() => {
    if (!enabled) return;
    let known = null;
    let unseen = 0;
    let stopped = false;
    const setTitle = () => {
      document.title = (unseen > 0 ? `(+${unseen}) ` : "") + PMAL_BASE_TITLE;
    };
    const clear = () => {
      if (document.visibilityState === "visible" && document.hasFocus()) {
        unseen = 0;
        setTitle();
      }
    };
    const poll = async () => {
      try {
        const d = await wkGet("responses", "select=id,created_at,a4_country,language&completed=eq.true&order=created_at.desc&limit=200");
        if (stopped || !Array.isArray(d)) return;
        if (known === null) {
          known = new Set(d.map(r => r.id));
          return;
        }

// Remount the dashboard a moment after a new response (after the stage FX),
// so the legacy KPI cards and fix-rate bars pick up the new row too.
function usePmalDashKey() {
  const [k, setK] = React.useState(0);
  React.useEffect(() => {
    let t = null;
    const onNew = ev => {
      if (ev.detail && ev.detail.test) return;
      clearTimeout(t);
      t = setTimeout(() => setK(x => x + 1), 2600);
    };
    window.addEventListener("pmal:new", onNew);
    return () => {
      clearTimeout(t);
      window.removeEventListener("pmal:new", onNew);
    };
  }, []);
  return k;
}

"Abmelden", "The Division Bell albümünün kapanış parçası. Gilmour şarkıyı Cambridge'deki çocukluğuna duyduğu nostaljiyle yazdı. Açılış satırı, büyüdüğü ve Syd Barrett ile tanıştığı sokakları anlatıyor.": "Der Schlusstitel des Albums The Division Bell. Gilmour schrieb den Song aus Nostalgie für seine Kindheit in Cambridge. Die erste Zeile beschreibt die Straßen, in denen er aufwuchs und Syd Barrett kennenlernte.", "Hetfield şarkıyı turne sırasında kız arkadaşıyla telefonda konuşurken yazdı. Telefonu omzuyla tutarken boş eliyle gitarın açık tellerini mırıldanıyordu — ikonik intro böyle doğdu. Şarkıyı banda çalmaya utandı çünkü 'Metallica için fazla yumuşaktı.' Lars Ulrich zorla ikna etti.": "Hetfield schrieb den Song auf Tour, während er mit seiner Freundin telefonierte. Den Hörer zwischen Schulter und Ohr geklemmt, zupfte er mit der freien Hand die offenen Saiten — so entstand das berühmte Intro. Er genierte sich, ihn aufzunehmen, weil er „zu sanft für Metallica“ war. Lars Ulrich musste ihn überreden.", "Slash ikonik intro riff'ini 'sadece bir parmak egzersizi' olarak çalıyordu — gerçek bir şarkı olmasını planlamıyordu. Axl Rose yan odadan duydu ve üzerine sözleri yazdı. Slash yıllar sonra 'O riff benim için bir şaka gibiydi, circus melody diyordum' dedi.": "Slash spielte das berühmte Intro-Riff „nur als Fingerübung“ — ein echter Song war nie geplant. Axl Rose hörte es im Nebenzimmer und schrieb den Text dazu. Jahre später sagte Slash: „Das Riff war für mich ein Witz, ich nannte es eine Zirkusmelodie.“", "Cobain riff'i Killing Joke'un 'Eighties' parçasından esinlenerek yazdı. Sözleri çelişkiler üzerine kurdu: 'Gel olduğun gibi, acele etmeden ama geç kalma.' Şarkıyı Aberdeen'deki çocukluğunun izolasyonuna bağladı.": "Cobain ließ sich für das Riff von Killing Jokes „Eighties“ inspirieren. Den Text baute er auf Widersprüchen auf: „Komm, wie du bist — lass dir Zeit, aber komm nicht zu spät.“ Er verband den Song mit der Isolation seiner Kindheit in Aberdeen.", "Knopfler şarkıyı New York'ta bir beyaz eşya mağazasında duyduğu konuşmadan yazdı. Bir tesisatçı, mağazadaki TV'lerde MTV izlerken rock yıldızlarına küfrediyordu. Knopfler mikrodalgaların arasından adamı gizlice dinledi ve sözleri bir kağıt peçeteye not etti. Sting tesadüfen aynı stüdyodaydı ve ikonik intro'yu tek seferde söyledi.": "Knopfler schrieb den Song nach einem Gespräch, das er in einem New Yorker Elektrogeschäft mithörte. Ein Handwerker schimpfte über die Rockstars, die auf den Fernsehern im Laden über MTV liefen. Knopfler lauschte zwischen den Mikrowellen und notierte den Text auf einer Papierserviette. Sting war zufällig im selben Studio und sang das berühmte Intro in einem Take ein.", "Kiedis bu şarkıyı yalnızlık ve bağımlılıktan çıkış sürecinde yazdı. Sözleri bir şiir defterinde saklıyordu, kimseye göstermedi. Prodüktör Rick Rubin defteri karıştırırken buldu ve 'Bu bir şarkı olmalı' dedi. Kiedis ilk başta itiraz etti — çok kişisel buluyordu.": "Kiedis schrieb diesen Song in einer Phase der Einsamkeit, auf dem Weg aus der Sucht. Den Text bewahrte er in einem Gedichtheft auf und zeigte ihn niemandem. Produzent Rick Rubin stieß beim Blättern darauf und sagte: „Daraus muss ein Song werden.“ Kiedis sträubte sich zunächst — es war ihm zu persönlich.", "Hammett ana riff'i gece 2-3 civarında Soundgarden dinledikten sonra yazdı. Hetfield'ın orijinal sözleri bebek ölümü hakkındaydı. Prodüktör Bob Rock ve Ulrich, Hetfield'a ilk kez sözlerini değiştirmesini söyleme cesaretini gösterdi. Rock sonra anlattı: 'Kimse daha önce James'e sözleri hakkında bir şey söylememişti.'": "Hammett schrieb das Hauptriff gegen zwei, drei Uhr nachts, nachdem er Soundgarden gehört hatte. Hetfields ursprünglicher Text handelte vom plötzlichen Kindstod. Produzent Bob Rock und Ulrich wagten als Erste, Hetfield um eine Textänderung zu bitten. Rock erzählte später: „Niemand hatte James je etwas zu seinen Texten gesagt.“", "Cobain, 1994'te Rolling Stone'a 'Mükemmel pop şarkısını yazmaya çalışıyordum. Pixies'i taklit etmeye çalışıyordum, itiraf etmeliyim' dedi. Şarkının adı, Kathleen Hanna'nın sarhoş bir gece Kurt'ün duvarına yazdığı 'Kurt smells like Teen Spirit' cümlesinden geldi. Kurt bunun devrimci bir slogan olduğunu sandı — aslında bir kız deodorantı markasıydı.": "Cobain sagte 1994 dem Rolling Stone: „Ich wollte den ultimativen Popsong schreiben. Ich habe versucht, die Pixies zu kopieren, das muss ich zugeben.“ Der Titel stammt von dem Satz „Kurt smells like Teen Spirit“, den Kathleen Hanna in einer durchzechten Nacht an Kurts Wand schrieb. Kurt hielt ihn für einen revolutionären Slogan — tatsächlich war es eine Deodorantmarke für Mädchen.", "Axl Rose bu şarkı üzerinde 1983'ten 1991'e kadar çalıştı. Orijinal demo 18 dakikaydı. Slash'in çölde yağmur altında solo çalması rock tarihinin en ikonik görüntülerinden biri oldu. Slash sonra 'O sahneyi çekerken gerçekten yağmur başladı, planlanmamıştı' dedi.": "Axl Rose arbeitete von 1983 bis 1991 an diesem Song. Das ursprüngliche Demo war 18 Minuten lang. Slashs Solo im Regen in der Wüste wurde zu einem der berühmtesten Bilder der Rockgeschichte. Slash sagte später: „Beim Dreh fing es wirklich an zu regnen, das war nicht geplant.“", "Gilmour bu şarkıyı gerçek uçuş dersleri alırken yazdı. Pilot lisansı için çalışıyordu ve uçağı kontrol etmeyi öğrenme sürecini bir metafor olarak kullandı. Waters'ın ayrılığından sonra Gilmour'un Pink Floyd'u tek başına yönlendirebildiğinin kanıtı oldu.": "Gilmour schrieb diesen Song, während er tatsächlich Flugstunden nahm. Er arbeitete auf seinen Pilotenschein hin und nutzte das Fliegenlernen als Metapher. Der Song bewies, dass Gilmour Pink Floyd nach Waters' Weggang allein führen konnte.", "Axl Rose, şarkının sözlerini Greyhound otobüsüyle LA'e ilk geldiği gece yaşadıklarından yazdı. Otobüsten iner inmez bir evsiz adam ona \"Welcome to the jungle\" diye seslendi.": "Axl Rose schrieb den Text über die Nacht, in der er mit dem Greyhound-Bus zum ersten Mal in L.A. ankam. Kaum war er ausgestiegen, rief ihm ein Obdachloser „Welcome to the jungle“ zu.", "Klaus Meine şarkıyı 1989 Moskova Müzik Barış Festivali'nin ardından yazdı. Doğulu ve Batılı müzisyenlerle Moskova Nehri'nde yapılan bir gece tekne gezisi ve Gorki Parkı sözlere girdi. Açılıştaki ıslığı Meine'nin kendisi çaldı. Şarkı Soğuk Savaş'ın bitişinin ve Almanya'nın yeniden birleşmesinin marşı oldu.": "Klaus Meine schrieb den Song nach dem Moscow Music Peace Festival 1989. Eine nächtliche Bootsfahrt auf der Moskwa mit Musikern aus Ost und West und der Gorki-Park fanden ihren Weg in den Text. Das gepfiffene Intro stammt von Meine selbst. Der Song wurde zur Hymne für das Ende des Kalten Krieges und die deutsche Wiedervereinigung.", "Toplam Yanıt": "Antworten gesamt", "Tamamlanan": "Abgeschlossen", "Ort. Süre": "Ø Dauer", "Bugün": "Heute", "Vaka 1 — 52Y K, Bart 2, %20": "Fall 1 — 52 J., w, Bart. 2, 20 %", "Vaka 2 — 76Y E, Bart 3, %18": "Fall 2 — 76 J., m, Bart. 3, 18 %", "Vaka 3 — 74Y K, Açık 3A, %28": "Fall 3 — 74 J., w, offen 3A, 28 %", "Vaka 4 — 55Y K, Bart 3, %36, lüksasyon": "Fall 4 — 55 J., w, Bart. 3, 36 %, Luxation", "SISTEM:": "SYSTEM:", "Vaka Bazlı Fix Oranları": "Fixationsraten je Fall", "Henüz veri yok": "Noch keine Daten", "Araştırma Ekibi": "Forschungsteam", "Yanıt Listesi (": "Antwortliste (", "Yükleniyor...": "Wird geladen …", "Yükleniyor…": "Wird geladen…", "Henüz yanıt bulunmamaktadır.": "Noch keine Antworten vorhanden.", "Tamamlandı": "Abgeschlossen", "Yarım": "Unvollständig", "Veri yok": "Keine Daten", "Yeterli veri yok": "Nicht genügend Daten", "Demografi": "Demografie", "Pratik": "Praxis", "Tutum + Vakalar": "Einstellungen + Fälle", "Çapraz analiz": "Kreuzanalyse", "Henüz tamamlanmış yanıt yok.": "Noch keine abgeschlossenen Antworten.", "İstatistikler": "Statistiken", "CSV indir": "CSV herunterladen", "A2 — Deneyim yılı": "A2 — Berufserfahrung (Jahre)", "A3 — Kurum tipi": "A3 — Art der Einrichtung", "A4 — Ülke dağılımı (top 15)": "A4 — Länderverteilung (Top 15)", "A5 — Yıllık
